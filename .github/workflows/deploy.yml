name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies (retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "npm ci attempt ${i}/3"
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt ${i})."
            if [ "$i" -lt 3 ]; then
              sleep $((i * 10))
            fi
          done
          exit 1

      - name: Build with vite (retry)
        run: |
          set -euo pipefail
          for i in 1 2; do
            echo "npm run build attempt ${i}/2"
            if npm run build; then
              exit 0
            fi
            echo "build failed (attempt ${i})."
            if [ "$i" -lt 2 ]; then
              sleep 10
            fi
          done
          exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
