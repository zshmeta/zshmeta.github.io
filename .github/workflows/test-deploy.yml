name: Test Deployment

on:
  pull_request:
    branches: [main]

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'

      - name: Install dependencies (retry)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "npm ci attempt ${i}/3"
            if npm ci; then
              exit 0
            fi
            echo "npm ci failed (attempt ${i})."
            if [ "$i" -lt 3 ]; then
              sleep $((i * 10))
            fi
          done
          exit 1

      - name: Run lint
        run: npm run lint

      - name: Run prettier
        run: npm run prettier

      - name: Build
        run: |
          set -euo pipefail
          for i in 1 2; do
            echo "npm run build attempt ${i}/2"
            if npm run build; then
              exit 0
            fi
            echo "build failed (attempt ${i})."
            if [ "$i" -lt 2 ]; then
              sleep 10
            fi
          done
          exit 1
        env:
          CI: ''
